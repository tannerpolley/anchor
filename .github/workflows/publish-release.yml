name: Publish JetBrains Plugin Release

on:
  push:
    # Triggers automatically when you push a tag like v1.0.0-beta.2
    tags:
      - 'v*'
  # Provides a manual "Run workflow" button in the Actions tab just in case
  workflow_dispatch: 

# Grants the action permission to create a release and upload the .zip
permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' 

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Release Metadata
        run: |
          set -Eeuo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          HEADER=$(grep -m 1 -F "## [$VERSION]" CHANGELOG.md || true)
          if [[ $HEADER != "## [$VERSION]"* ]]; then
            echo "::error::CHANGELOG.md has no exact heading for $VERSION"
            exit 1
          fi
          CLEAN_HEADER=${HEADER#"## "}
          ANCHOR=$(printf '%s' "$CLEAN_HEADER" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/[^a-z0-9_-]//g')
          printf 'TAG_NAME=%s\n' "$TAG_NAME" >> "$GITHUB_ENV"
          printf 'ANCHOR=%s\n' "$ANCHOR" >> "$GITHUB_ENV"

      - name: Check Bash Scripts
        run: |
          set -Eeuo pipefail
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          ./scripts/test-validators.sh

      - name: Run Tests
        run: ./gradlew --no-daemon test

      - name: Verify Plugin
        run: ./gradlew --no-daemon verifyPlugin

      - name: Build Plugin
        run: ./gradlew --no-daemon buildPlugin

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew --no-daemon publishPlugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Anchor ${{ env.TAG_NAME }}
          # Prevents GitHub from appending the ugly commit diff list
          generate_release_notes: false 
          body: |
            Welcome to Anchor `${{ env.TAG_NAME }}`! ⚓️
            
            All new features, UI improvements, and bug fixes are documented in the project's official changelog.
            
            👉 **[Read the release notes for ${{ env.TAG_NAME }}](https://github.com/alph-a07/anchor/blob/main/CHANGELOG.md#${{ env.ANCHOR }})**
          files: build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
